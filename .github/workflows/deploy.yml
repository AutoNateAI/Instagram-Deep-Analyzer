name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Set this to your default branch name

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      # If you need to build or process files before deployment (not needed for this static site)
      # Add build steps here if necessary

      # Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v3

      # Deploy to GitHub Pages
      - name: Deploy 🚀
        id: deployment
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .  # The folder containing the built website (current directory)
          branch: gh-pages  # The branch to deploy to
          clean: true  # Automatically remove deleted files from the deployment branch
          clean-exclude: |
            .gitignore
            .nojekyll
          commit-message: "Deployed website [skip ci]"
          token: ${{ github.token }}  # Use the GitHub token with proper permissions
          single-commit: true  # Keep gh-pages branch history clean
